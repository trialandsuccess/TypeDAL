site_name: TypeDAL
site_description: Welcome to TypeDAL's documentation
site_url: https://github.com/trialandsuccess/typedal
nav:
  - 1. Getting Started: 1_getting_started.md
  - 2. Defining Tables: 2_defining_tables.md
  - 3. Building Queries: 3_building_queries.md
  - 4. Relationships: 4_relationships.md
  - 5. py4web and web2py: 5_py4web.md
  - 6. Migrations: 6_migrations.md
  - 7. Configuration: 7_configuration.md
  - 8. Mixins: 8_mixins.md
  - 9. Function Memoization: 9_memoization.md
  - 10. Advanced APIs: 10_advanced_apis.md
  - 11. Async: 11_async.md
repo_url: https://github.com/trialandsuccess/TypeDAL
repo_name: trialandsuccess/TypeDAL

theme:
  name: material
  custom_dir: docs-theme
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.top
    - navigation.footer
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
