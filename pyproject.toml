[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[project]
name = "TypeDAL"
description = 'Typing support for PyDAL'
readme = "README.md"
version = "6.0.0b1"
requires-python = ">=3.12"
license-expression = "MIT"
keywords = []
authors = [
    { name = "Robin van der Noord", email = "contact@trialandsuccess.nl" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    # core; 20260520.0 is the first release with Set._apply_update, which UpdateSet relies on.
    # Note: pydal's newer 3.YYYYMMDD versions sort *below* this under PEP 440 and are excluded on purpose for now.
    "pydal >= 20260520.0",
    "pydal-stubs >= 0.2.0", # improved typing for pydal
    "dill < 1", # caching
    "configuraptor >= 2.1.0, < 3", # config
    "Configurable-JSON < 2", # json dumping
    "python-slugify < 9",
    "legacy-cgi; python_version >= '3.13'",
    "python-dateutil < 3",
]

[project.optional-dependencies]
py4web = [
    "py4web",
]

cli = [
    "typer >=0.18, <0.19",
    "tabulate",
    "questionary",
    "tomlkit",
    "pydal2sql>=1.3.5",
]

migrations = [
    "tabulate",
    "pydal2sql>=1.3.5",
    "edwh-migrate>=0.8.0",
    # cli:
    "typer >=0.18, <0.19",
    "tabulate",
    "questionary",
    "tomlkit",
    "pydal2sql>=1.3.5",
]

typescript = [
    "typtyp < 1",
    # cli:
    "typer >=0.18, <0.19",
    "tabulate",
    "questionary",
    "tomlkit",
    "pydal2sql>=1.3.5",
]

all = [
    "py4web",
    "typtyp < 1",
    "tabulate",
    "edwh-migrate[full]>=0.8.0",
    "pydantic < 3",
    # cli:
    "typer >=0.18, <0.19",
    "tabulate",
    "questionary",
    "tomlkit",
    "pydal2sql[all]>=1.3.5",
]

dev = [
    # build:
    "ewok",
    # lint (`edwh lint`: ruff + ty), format (`edwh fmt`) and test (`edwh test.run`):
    "edwh>=1.18",
    # test:
    "pytest",
    "pytest-cov",
    "mypy", # used by pytest-typing
    # "pytest-mypy-testing",
    "pytest-typing",
    "pytest-asyncio",
    "pyright < 1.1.400",
    "contextlib-chdir",
    "testcontainers[mysql]>=4.15", # testcontainers.community.mysql
    "pydantic < 3",
    "psycopg2-binary",
    # depends on ->
    "requests<2.32",
    # mypy:
    "types-tabulate",
    "types-PyYAML",
    "types-requests",
    # docs:
    'mkdocs',
    'mkdocs-dracula-theme',
]

[template.plugins.default]
src-layout = true

[tool.setuptools.package-data]
"typedal" = ["py.typed"]

[project.scripts]
typedal = "typedal.cli:app"

[project.urls]
Documentation = "https://typedal.readthedocs.io/"
Issues = "https://github.com/trialandsuccess/TypeDAL/issues"
Source = "https://github.com/trialandsuccess/TypeDAL"

[tool.vommit]
allow_breaking_bang = true
allow_breaking_footer = true
prerelease_token = "beta"
confirm = true

[tool.vommit.git]
enabled = true
origin = "origin"
branch = "master"
on_wrong_branch = "error"
tag_format = "v{version}"
commit_format = "{version}"

[tool.vommit.changelog]
enabled = true
file = "CHANGELOG.md"
include_prereleases = false
placeholder = "<!--next-version-placeholder-->"
placeholder_regex = "^<!\\-\\-next\\-version\\-placeholder\\-\\->$"
entry_title_format = "## v{version} ({date:%Y-%m-%d})"

[tool.vommit.changelog.levels]
feat = "Feature{s}"
fix = "Fix{es}"
break = "Breaking Change{s}"
docs = "Documentation"
perf = "Performance"

[tool.vommit.pypi]
enabled = true
use_keyring = true

[tool.vommit.commands]
clean = "rm -rf ./dist"
build = "uv build"
publish = "uv publish"
post_publish = "rm -rf ./dist"

[tool.vommit.version_bump_map]
break = "major"
feat = "minor"
fix = "patch"
perf = "patch"

[tool.edwh.test]
# measure coverage over src/ only
directory = "src"

[tool.coverage.run]
# measure src/ only, whatever invokes coverage: `edwh test.run` passes `--cov=src` itself, but a
# bare `pytest --cov` would otherwise measure the whole tree (tests, tasks.py, example_*.py).
source = ["src"]
# line coverage alone hides untested branches (an `if` that is never false still counts as 100%):
branch = true

[tool.coverage.report]
# the CI gate: pytest-cov fails the run below this
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
    "if t.TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "except ImportError as e:",
    "except ImportError:",
    ]

[tool.mypy]
python_version = "3.13"

# `some: int = None` looks nicer than `some: int | None = None` and pycharm still understands it
no_implicit_optional = false  # I guess 'strict_optional' should be true, but disable this one because it's double!
# same as above (thrown if no_implicit_optional = False)
# ACTUALLY: not the same! Setting strict_optional = false may miss some type errors like
# 'Item "None" of "Optional" has no attribute "lower"'
# 'strict_optional' complains more for class properties and 'no_implicit_optional' for function arguments
# strict_optional = false
# 3rd party packages may not be typed, that's not my fault!
ignore_missing_imports = true
# kinda hypocritical to disable Optional and still enable strict, but I do agree with some other strict rules.
strict = true
# fixes defs with clear return var (doesn't seem to work for __init__ which is the most obvious case)
# check_untyped_defs = True
# disable_error_code = "misc" # skip misc makes mypy tests fail!

exclude = ["venv", ".bak"]

[tool.ruff]
target-version = "py312"
line-length = 120

extend-exclude = ["*.bak/", "venv*/", "tests/", "example_*.py"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.14"

[tool.ruff.lint]

select = [
    "F", # pyflake error
    "E", # pycodestyle error
    "W", # pycodestyle warning
    "Q", # quotes
    "A", # builtins
    # "C4", # comprehensions - NO: doesn't allow dict()
    # "RET", # return - NO: annoying
    "SIM", # simplify
    "ARG", # unused arguments
    # "COM", # comma's - NO: annoying
    # "PTH", # use pathlib - NO: annoying
    "RUF", # ruff rules
    "D", # docstrings (google convention, see below)
    "D213", # multi-line docstring summary on the second line (not part of the google convention)
    "S", # security (bandit)
]
unfixable = [
    # Don't touch unused imports
    "F401",
]
extend-ignore = [
    # db.field == None should NOT be fixed to db.field is None
    "E711",
    "D200",
    "D212",
    "D418",
]

ignore = [
    "RUF012", # mutable class attributes
    "RUF013", # implicit optional
    "S101", # assert: used for type narrowing and invariants
    "S108", # hard coded /tmp/... files are fine
]


[tool.ruff.lint.pydocstyle]
convention = "google"

### and if it's a project and NOT a package, add this to make it not look for anything buildable: ###
# make this a meta package: not a library but simply allow me to run `pip install .[dev]`
#[build-system]
#build-backend = "setuptools.build_meta"
#requires = ["setuptools"]
#
#[tool.setuptools.packages.find]
## look nowhere for any code to 'build' since this is just used to manage (dev) dependencies
#where = []

[tool.pytest]
pythonpath = [
    "src",
]

typing_checkers = [
    "mypy",
    "pyright",
]

[tool.typedal]
# e.g.
# lazy-policy = "forbid"
